# v0.2 导入冒烟: 诗词库搜索→导入春晓→切换篇目
appId: com.k2fsa.sherpa.onnx.simulate.streaming.asr
android:
  ignoreKeyboardTiles: true
---
- launchApp
- tapOn: '导入'
- tapOn: '.*书 库.*'
- tapOn: '.*搜索标题.*'
- inputText: '春眠'
- hideKeyboard
- assertVisible: '.*春晓.*'
- tapOn:
    text: '.*春晓.*'
- assertVisible: '.*已导入「春晓」.*'
- assertVisible: '.*春晓.*▾.*'   # 导入成功自动回Home, 标题已切换
