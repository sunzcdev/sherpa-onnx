name: beisong-assistant-apk

on:
  push:
    branches:
      - apk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beisong_assistant_apk:
    runs-on: ubuntu-latest
    name: Build 智能背诵助手 APK

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: android/SherpaOnnxSimulateStreamingAsr/debug.keystore
          key: ${{ runner.os }}-debug-keystore
          restore-keys: |
            ${{ runner.os }}-debug-keystore

      - name: Generate debug keystore if missing
        working-directory: android/SherpaOnnxSimulateStreamingAsr
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -alias debug \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Debug,OU=Dev,O=Beisong,L=Shenzhen,ST=Guangdong,C=CN" \
              -sigalg SHA256withRSA
          fi

      - name: Build APK (debug-signed, 直接可装)
        working-directory: android/SherpaOnnxSimulateStreamingAsr
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cd android/SherpaOnnxSimulateStreamingAsr/app/build/outputs/apk/debug
          ls -lh
          V=$(grep -oP 'versionName = "\K[0-9.]+' ../../../../build.gradle.kts 2>/dev/null || echo 0.1.1)
          cp app-debug.apk beisong-assistant.apk
          cp app-debug.apk beisong-assistant-$V.apk
          ls -lh beisong-assistant*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beisong-assistant-apk
          path: android/SherpaOnnxSimulateStreamingAsr/app/build/outputs/apk/debug/beisong-assistant*.apk
          retention-days: 14

      - name: Compute release tag from versionName
        if: github.ref == 'refs/heads/apk'
        id: ver
        run: |
          V=$(grep -oP 'versionName = "\K[0-9.]+' android/SherpaOnnxSimulateStreamingAsr/app/build.gradle.kts)
          echo "tag=beisong-v$V" >> "$GITHUB_OUTPUT"
          echo "release tag will be beisong-v$V"

      - name: Purge broken release metadata (self-heal)
        if: github.ref == 'refs/heads/apk'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 若同名 release 已存在但 target_commitish != apk (历史误建/复用),
          # 整个删掉, 让下一步 softprops 以正确 tag/target/body 重建
          V=$(grep -oP 'versionName = "\K[0-9.]+' android/SherpaOnnxSimulateStreamingAsr/app/build.gradle.kts)
          REL=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/beisong-v$V") || { echo "no existing release"; exit 0; }
          TGT=$(echo "$REL" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("target_commitish",""))')
          if [ "$TGT" != "apk" ]; then
            ID=$(echo "$REL" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
            echo "release $ID target=$TGT != apk → delete for rebuild"
            curl -sf -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$ID" > /dev/null
          fi

      - name: Release APK
        if: github.ref == 'refs/heads/apk'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: apk
          name: beisong-assistant ${{ steps.ver.outputs.tag }}
          body: |
            背诵助手 APK (debug 签名, 直接可装)
            - v0.2.1: 课本书库 (四上语文/PEP英语/单词表) + OCR 清洗 diff + 英文 whisper-tiny.en 双模型 ASR
          files: android/SherpaOnnxSimulateStreamingAsr/app/build/outputs/apk/debug/beisong-assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}