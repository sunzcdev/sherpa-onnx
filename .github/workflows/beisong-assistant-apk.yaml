name: beisong-assistant-apk

on:
  push:
    branches:
      - apk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beisong_assistant_apk:
    runs-on: ubuntu-latest
    name: Build 智能背诵助手 APK

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: android/SherpaOnnxSimulateStreamingAsr/debug.keystore
          key: ${{ runner.os }}-debug-keystore
          restore-keys: |
            ${{ runner.os }}-debug-keystore

      - name: Generate debug keystore if missing
        working-directory: android/SherpaOnnxSimulateStreamingAsr
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -alias debug \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Debug,OU=Dev,O=Beisong,L=Shenzhen,ST=Guangdong,C=CN" \
              -sigalg SHA256withRSA
          fi

      - name: Build APK (debug-signed, 直接可装)
        working-directory: android/SherpaOnnxSimulateStreamingAsr
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cd android/SherpaOnnxSimulateStreamingAsr/app/build/outputs/apk/debug
          ls -lh
          cp app-debug.apk beisong-assistant.apk
          ls -lh beisong-assistant.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beisong-assistant-apk
          path: android/SherpaOnnxSimulateStreamingAsr/app/build/outputs/apk/debug/beisong-assistant.apk
          retention-days: 14

      - name: Release APK
        if: github.ref == 'refs/heads/apk'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beisong-v0.1.0
          files: android/SherpaOnnxSimulateStreamingAsr/app/build/outputs/apk/debug/beisong-assistant.apk
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}