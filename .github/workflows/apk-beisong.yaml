name: apk-beisong

on:
  push:
    branches:
      - apk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk_beisong:
    runs-on: ubuntu-latest
    name: Build 智能背诵助手 APK

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: 25.2.9512533

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}

      - name: Build APK
        working-directory: android/SherpaOnnxSimulateStreamingAsr
        run: ./gradlew assembleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/SherpaOnnxSimulateStreamingAsr/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_SIGNING_KEY_STORE_PASSWORD }}

      - name: Rename APK
        run: |
          cd android/SherpaOnnxSimulateStreamingAsr/app/build/outputs/apk/release
          rm -fv signingKey.jks
          rm -fv *.apk.idsig
          rm -fv *-aligned.apk
          mv -v *-signed.apk beisong-assistant.apk
          ls -lh beisong-assistant.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beisong-assistant-apk
          path: android/SherpaOnnxSimulateStreamingAsr/app/build/outputs/apk/release/beisong-assistant.apk